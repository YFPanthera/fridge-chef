[project]
name = "fridge-chef-backend"
version = "0.1.0"
description = "Zero-Waste Chef Recipe Generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "google-genai>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
